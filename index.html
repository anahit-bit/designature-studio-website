<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Designature Studio | Interior Design Yerevan</title>
    <meta name="description" content="Designature Studio is a premier interior design and architectural firm in Yerevan, Armenia. We create exceptional spaces that blend aesthetics with functionality through innovative design and AI-powered concepts." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://designature.studio" />
    <meta property="og:title" content="Designature Studio | Interior Design Yerevan" />
    <meta property="og:description" content="Premier interior design and architectural firm in Yerevan, Armenia. Exceptional spaces blending aesthetics with functionality through innovative design." />
    <meta property="og:image" content="https://res.cloudinary.com/dys2k5muv/image/upload/v1772532381/1_h9ofqr.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://designature.studio" />
    <meta property="twitter:title" content="Designature Studio | Interior Design Yerevan" />
    <meta property="twitter:description" content="Premier interior design and architectural firm in Yerevan, Armenia. Exceptional spaces blending aesthetics with functionality through innovative design." />
    <meta property="twitter:image" content="https://res.cloudinary.com/dys2k5muv/image/upload/v1772532381/1_h9ofqr.jpg" />

    <!-- Preconnect to image CDN so the hero image handshake starts in parallel with HTML parsing. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">

    <!-- Preload first hero slide. The browser fetches this in parallel with JS so the LCP image
         arrives before React renders. The srcset/sizes match Hero.tsx. Only fires on '/'. -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1440/v1770985128/1_wsuf6e.jpg"
      imagesrcset="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_390/v1770985128/1_wsuf6e.jpg 390w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_768/v1770985128/1_wsuf6e.jpg 768w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1024/v1770985128/1_wsuf6e.jpg 1024w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1440/v1770985128/1_wsuf6e.jpg 1440w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1920/v1770985128/1_wsuf6e.jpg 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Preload AI Vision logged-out hero pair (pair 7 / Minimalism — the featured slot on
         load). srcset/sizes match AIVisionShowcase.tsx so the browser dedupes the request. -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1024,h_1024,e_sharpen:60/AI/after_7_i66inr_square"
      imagesrcset="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_800,h_800,e_sharpen:60/AI/after_7_i66inr_square 800w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1280,h_1280,e_sharpen:60/AI/after_7_i66inr_square 1280w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1600,h_1600,e_sharpen:60/AI/after_7_i66inr_square 1600w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1920,h_1920,e_sharpen:60/AI/after_7_i66inr_square 1920w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_2400,h_2400,e_sharpen:60/AI/after_7_i66inr_square 2400w"
      imagesizes="(min-width: 1024px) min(1900px, 100vw), 100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1024,h_1024,e_sharpen:60/AI/before_7_bwczrl_square"
      imagesrcset="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_800,h_800,e_sharpen:60/AI/before_7_bwczrl_square 800w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1280,h_1280,e_sharpen:60/AI/before_7_bwczrl_square 1280w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1600,h_1600,e_sharpen:60/AI/before_7_bwczrl_square 1600w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1920,h_1920,e_sharpen:60/AI/before_7_bwczrl_square 1920w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_2400,h_2400,e_sharpen:60/AI/before_7_bwczrl_square 2400w"
      imagesizes="(min-width: 1024px) min(1900px, 100vw), 100vw"
      fetchpriority="high"
    />

    <!-- Preload Style Quiz logged-out hero preview. srcset/sizes match the img in
         AIConceptsPage.tsx (logged-out Style Quiz block). -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_960,h_960,e_sharpen:60/v1774949502/5_sqgqmb.jpg"
      imagesrcset="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_640,h_640,e_sharpen:60/v1774949502/5_sqgqmb.jpg 640w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_960,h_960,e_sharpen:60/v1774949502/5_sqgqmb.jpg 960w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1280,h_1280,e_sharpen:60/v1774949502/5_sqgqmb.jpg 1280w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:best,c_fill,g_auto,w_1920,h_1920,e_sharpen:60/v1774949502/5_sqgqmb.jpg 1920w"
      imagesizes="(min-width: 1024px) min(950px, 60vw), 100vw"
      fetchpriority="high"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Cormorant Garamond"', 'serif'],
              body: ['Montserrat', 'sans-serif'],
            },
            letterSpacing: { architectural: '-0.04em' },
            keyframes: {
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-5px)' },
                '75%': { transform: 'translateX(5px)' },
              }
            },
            animation: { shake: 'shake 0.2s ease-in-out 0s 2' }
          }
        }
      }
    </script>
    <style>
      * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body { background-color: #FFFFFF; color: #000000; scroll-behavior: smooth; overflow-x: hidden; }
      html { overflow-x: hidden; }
      ::selection { background: #000000; color: #FFFFFF; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #fff; }
      ::-webkit-scrollbar-thumb { background: #000; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInFromBottom { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .fade-in { animation: fadeIn 1s ease-out forwards; }
      .slide-in-from-bottom { animation: slideInFromBottom 1s ease-out forwards; }
    </style>
  </head>
  <body class="font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
