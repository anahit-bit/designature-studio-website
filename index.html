<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Per-route <title>, <meta name="description">, canonical, and OG tags
         are injected at runtime by <SeoHead> (see src/components/SeoHead.tsx),
         which uses React 19 native head hoisting. We deliberately do NOT ship
         a static <title> or <meta name="description"> here — React 19 appends
         rather than replaces, so a static fallback would create duplicate tags
         in the rendered DOM and confuse crawlers. JS-running crawlers (Google,
         Bing) get the per-route values via React. Non-JS social crawlers
         (Facebook/LinkedIn/WhatsApp/Slack) get only the og:image fallback below
         until S-019 (server-side meta injection) lands in Phase 2. -->
    <meta property="og:image" content="https://res.cloudinary.com/dys2k5muv/image/upload/v1772532381/1_h9ofqr.jpg" />

    <!-- Preconnect to image CDN so the hero image handshake starts in parallel with HTML parsing. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">

    <!-- Preload first hero slide. The browser fetches this in parallel with JS so the LCP image
         arrives before React renders. The srcset/sizes match Hero.tsx. Only fires on '/'. -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1440/v1770985128/1_wsuf6e.jpg"
      imagesrcset="https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_390/v1770985128/1_wsuf6e.jpg 390w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_768/v1770985128/1_wsuf6e.jpg 768w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1024/v1770985128/1_wsuf6e.jpg 1024w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1440/v1770985128/1_wsuf6e.jpg 1440w, https://res.cloudinary.com/dys2k5muv/image/upload/f_auto,q_auto:good,c_limit,w_1920/v1770985128/1_wsuf6e.jpg 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Cormorant Garamond"', 'serif'],
              body: ['Montserrat', 'sans-serif'],
            },
            letterSpacing: { architectural: '-0.04em' },
            keyframes: {
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-5px)' },
                '75%': { transform: 'translateX(5px)' },
              }
            },
            animation: { shake: 'shake 0.2s ease-in-out 0s 2' }
          }
        }
      }
    </script>
    <style>
      * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body { background-color: #FFFFFF; color: #000000; scroll-behavior: smooth; overflow-x: hidden; }
      html { overflow-x: hidden; }
      ::selection { background: #000000; color: #FFFFFF; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #fff; }
      ::-webkit-scrollbar-thumb { background: #000; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInFromBottom { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .fade-in { animation: fadeIn 1s ease-out forwards; }
      .slide-in-from-bottom { animation: slideInFromBottom 1s ease-out forwards; }
    </style>
  </head>
  <body class="font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
